version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    target-branch: dev
    labels:
      - kind:deps
      - automated
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: 'exceljs'
        versions:
          - '>=5'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:30'
      timezone: 'America/New_York'
    target-branch: dev
    labels:
      - kind:deps
      - automated
      - comp:ci
