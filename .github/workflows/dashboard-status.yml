name: Dashboard Status

# Runs the quality-gate suite nightly and publishes one JSON result to the status-data branch.
# This is the only place these checks execute -- see issue_tracker for the incident (a wedged
# local `tools` container silently took the whole Developer Dashboard down for hours) that
# motivated moving execution out of any long-lived server process entirely.
#
# Each check is its OWN job, running in parallel on its own runner, with its own timeout. An
# earlier version ran all 8 checks sequentially inside one script in one job: E2E hung with zero
# output for 35+ minutes on its first real run, and the 45-minute job timeout killed the whole
# thing -- discarding the 7 other checks that had already succeeded. Splitting into separate jobs
# means a hung check only costs that one check's result; `aggregate` runs with `if: always()` and
# publishes whatever the other jobs produced regardless.
#
# Each job writes its outputs (meta.json + whatever report file it produces) into its own
# .ci-out/<key>/ directory and uploads that directory AS-IS. Uploading a directory path makes its
# *contents* the artifact root, so downloading it back into .ci-artifacts/<key>/ lands the files
# exactly where aggregate-dashboard-status.ts expects them -- no extra flattening step needed.
on:
  schedule:
    # 07:17 UTC = ~03:17 America/New_York during DST (~02:17 in standard time). Deliberately NOT
    # on the hour: GitHub explicitly documents that scheduled workflows queue behind everyone
    # else's runs and get delayed under load, worst at popular round-hour times like :00 -- the
    # first real overnight run, scheduled for 0 8 * * *, actually fired at 10:30 UTC, 2.5 hours
    # late. Also moved earlier (was 08:00) to build in real buffer: even a ~1 hour scheduling
    # delay plus the full ~30-minute worst-case run (E2E timing out at its 20-minute cap) should
    # still finish well before a normal morning check-in, not run into it.
    - cron: '17 7 * * *'
  workflow_dispatch: {} # manual trigger from GitHub's UI, for testing this workflow itself
  push:
    branches: [dev]
    # Docs-only commits can't change any check's outcome, and a full run costs ~24 job-minutes.
    paths-ignore:
      - 'issue_tracker/**'
      - 'docs/**'
      - '**.md'

# Serialises runs per ref, which matters for two reasons. `aggregate` holds contents:write and
# pushes to the status-data branch -- two overlapping runs would race there and one would die on
# a non-fast-forward. And on a rapid push sequence, superseded runs are pointless: only the tip
# commit's result gets published, so cancelling in-flight work saves minutes with no lost signal.
concurrency:
  group: dashboard-status-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: dev # single environment while this workflow is still being proven out -- see
  # the note in the `checkout` step of each job. Re-add stage as a second value once dev has run
  # cleanly a few times and stage is caught up.
  #
  # Every job checks out `github.event_name == 'push' && github.sha || TARGET_BRANCH`, NOT
  # TARGET_BRANCH unconditionally. That distinction only matters once a push trigger exists, and
  # it matters a lot: checkout resolves independently in each of the 10 jobs, at whatever moment
  # that job's runner starts. Pinned to the branch tip, two pushes in quick succession would have
  # jobs within a single run checking out DIFFERENT commits, and `aggregate` would publish one
  # status JSON attributing that mixture to the commit GitHub labelled the run with. A green
  # result attributed to a commit that was never tested is worse than a red one -- it is silent,
  # and the published artifact looks authoritative. Schedule and workflow_dispatch have no
  # triggering SHA, so they keep the original tip-of-branch behaviour.

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: >
          npx tsx scripts/ci/run-check.ts --name "Unit tests" --meta .ci-out/unit/meta.json --
          npm run test:unit -- --reporter=default --reporter=json
          --outputFile.json=.ci-out/unit/unit-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit
          path: .ci-out/unit
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: >
          npx tsx scripts/ci/run-check.ts --name "Integration tests" --meta .ci-out/integration/meta.json --
          npm run test:integration:dashboard -- --reporter=default --reporter=json
          --outputFile.json=.ci-out/integration/integration-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration
          path: .ci-out/integration
          if-no-files-found: warn

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: >
          npx tsx scripts/ci/run-check.ts --name "Postgres DB tests" --meta .ci-out/postgres/meta.json --
          npm run test:postgres -- --reporter=json --outputFile.json=.ci-out/postgres/postgres-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres
          path: .ci-out/postgres
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/ci/run-check.ts --name "Static analysis (lint)" --meta .ci-out/lint/meta.json -- npm run lint
      - name: Best-effort structured issue list
        if: always()
        run: npm run lint -- --format json --output-file .ci-out/lint/lint-results.json || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: .ci-out/lint
          if-no-files-found: warn

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/ci/run-check.ts --name "Static analysis (typecheck)" --meta .ci-out/typecheck/meta.json -- npm run typecheck
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck
          path: .ci-out/typecheck
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/ci/run-check.ts --name "Coverage" --meta .ci-out/coverage/meta.json -- npm run coverage
      - if: always()
        run: mkdir -p .ci-out/coverage && cp coverage/coverage-summary.json .ci-out/coverage/coverage-summary.json || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .ci-out/coverage
          if-no-files-found: warn

  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # analyze:complexity:json writes .ci-out/complexity/scan.json itself (--json-out) and still
      # exits non-zero on a threshold violation, same as `npm run analyze:complexity` always has
      # locally -- meta.json below faithfully records that real exitCode/ok. The `|| true` is
      # deliberate and temporary: this check is brand new and nobody has triaged the repo's
      # existing violations yet (at least one is already known: SemanticIcon.tsx), so this job
      # must not go red for pre-existing debt nobody asked it to flag as a build break. Remove
      # `|| true` once that burn-in triage is done and the team wants this to gate for real -- see
      # the matching aggregate-dashboard-status.ts comment, which must be reverted at the same time.
      - run: npx tsx scripts/ci/run-check.ts --name "Complexity" --meta .ci-out/complexity/meta.json -- npm run analyze:complexity:json || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complexity
          path: .ci-out/complexity
          if-no-files-found: warn

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # analyze:deps:json (scripts/ci/depcruise-scan.ts) writes .ci-out/dependencies/scan.json
      # itself and still exits non-zero on an error-severity dependency-cruiser violation, same
      # as `npm run analyze:deps` always has locally -- meta.json below faithfully records that
      # real exitCode/ok. The `|| true` is deliberate and temporary, same reasoning as the
      # `complexity` job: this check is brand new and nobody has agreed this dashboard should gate
      # on it yet, so it must not go red the first time a real violation shows up. Remove `|| true`
      # once the team wants this to gate for real -- see the matching aggregate-dashboard-
      # status.ts comment, which must be reverted at the same time.
      - run: npx tsx scripts/ci/run-check.ts --name "Dependencies" --meta .ci-out/dependencies/meta.json -- npm run analyze:deps:json || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependencies
          path: .ci-out/dependencies
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Build container images
        run: docker compose --env-file .env.docker.dev.fallback -f compose.yaml build
      - name: Run security scan
        # security-component-scan.mjs's structured payload comes over stdout, not a report file --
        # `tee` both streams it live to the job log and captures it to a file for the aggregator.
        run: |
          set -o pipefail
          mkdir -p .ci-out/security
          started=$(date +%s%3N)
          npm run security:scan:components --silent 2>&1 | tee .ci-out/security/security-output.txt
          exit_code=${PIPESTATUS[0]}
          ended=$(date +%s%3N)
          printf '{"name":"Security vulnerabilities","command":"npm run security:scan:components","exitCode":%d,"ok":%s,"durationMs":%d}' \
            "$exit_code" "$([ "$exit_code" -eq 0 ] && echo true || echo false)" "$((ended - started))" > .ci-out/security/meta.json
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security
          path: .ci-out/security
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
          fetch-depth: 0 # gitleaks/trufflehog scan full git history, not just the checked-out tree
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install gitleaks
        # gitleaks has no install.sh (unlike Trivy/trufflehog below) -- pulling the pinned release
        # tarball directly. Version pinned rather than "latest" so a new gitleaks release can't
        # silently change findings/behavior on an unrelated commit; bump deliberately.
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm /tmp/gitleaks.tar.gz
      - name: Install trufflehog
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Run secret scan
        # security-scan-secrets.mjs's structured payload comes over stdout, not a report file --
        # `tee` both streams it live to the job log and captures it to a file for the aggregator.
        # Never redirect gitleaks'/trufflehog's own raw output here: the scanner script consumes
        # them as subprocesses and only ever prints its own sanitized (masked/fingerprinted)
        # payload to stdout, so `tee`-ing this job's stdout cannot leak a raw secret into the log.
        run: |
          set -o pipefail
          mkdir -p .ci-out/secrets
          started=$(date +%s%3N)
          npm run security:scan:secrets --silent 2>&1 | tee .ci-out/secrets/secret-scan-output.txt
          exit_code=${PIPESTATUS[0]}
          ended=$(date +%s%3N)
          printf '{"name":"Secret integrity","command":"npm run security:scan:secrets","exitCode":%d,"ok":%s,"durationMs":%d}' \
            "$exit_code" "$([ "$exit_code" -eq 0 ] && echo true || echo false)" "$((ended - started))" > .ci-out/secrets/meta.json
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secrets
          path: .ci-out/secrets
          if-no-files-found: warn

  e2e-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast: false, not the GH Actions default (true) -- cancelling sibling shards on the
      # first failure would contradict this whole pipeline's "always publish whatever the other
      # jobs produced" design (see the header comment and `aggregate`'s if: always()). Each shard
      # gets its own runner and its own fresh webServer instance (API + web, both
      # reuseExistingServer: true but nothing is already listening on a clean runner). Unlike the
      # old combined job, the functional project has no workers cap (playwright.config.ts) --
      # nothing here shares mutable state across workers or shards, so that's fine.
      #
      # Shard count matches the functional project's spec FILE count (4), not an arbitrary round
      # number -- sharding is per-file, so a 5th shard would always come up empty (spin up a
      # runner, npm ci, install Chromium, find 0 tests assigned, exit), burning CI minutes for
      # zero benefit. Bump this back up if a new functional spec file is added. The visual project
      # is a separate job below (e2e-visual) -- it doesn't shard, and it doesn't run on this bare
      # runner at all, since visual-baseline.spec.ts refuses to run outside its canonical
      # container (containerGuard.ts, see the UI-testing breakout plan's P4).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # File Imports & Validation (Phase 6+) has no in-memory fallback for the import pipeline --
      # unlike the older atomic /api/reconciliation/run route, POST /api/imports/runs always needs
      # a real Postgres connection. This job used to run against an in-memory backend
      # (ALLOW_LOCAL_LOGIN_FALLBACK) matching the old route's own fallback; that stopped being
      # sufficient once Screen 01 (Phase 9) made the import pipeline the default landing flow. Same
      # fix as docker-validate.yml's e2e-functional job -- see that file's own comment for the full
      # reasoning; kept in sync here since this is a separate job in a separate workflow.
      - name: Start Postgres and run migrations
        run: |
          set -euo pipefail
          printf '%s\n' \
            'POSTGRES_DB=reconciliation_platform' \
            'POSTGRES_USER=recon_app' \
            'POSTGRES_PASSWORD=change-ci-password' \
            'POSTGRES_HOST_PORT=5432' \
            'ENABLE_PGAUDIT=false' \
            'API_DATABASE_URL=unused' \
            'JWT_SECRET=unused-ci-placeholder' \
            > ci-e2e.env
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} up -d postgres --wait
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} run --rm migrate
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} exec -T postgres \
            psql -U recon_app -d reconciliation_platform < scripts/db/dev-stage/create-users.psql
      # DISABLE_API_RATE_LIMIT: the route-sweep and signup specs (ISSUE-026/ISSUE-033) each do
      # real logins in sequence -- against a local Postgres, this reproducibly tripped the API's
      # 120-requests/minute rate limit (a real 429 on /api/auth/me, confirmed via the failing
      # run's network trace) once total e2e request volume crossed that threshold. The limiter is
      # generic Express middleware applying regardless of persistence backend. Safe to disable for
      # this job specifically: DISABLE_API_RATE_LIMIT has no production-safety guard of its own,
      # but this env var only ever reaches the ephemeral webServer this job spawns for itself,
      # never a deployed instance.
      #
      # DATABASE_URL points the native webServer (Playwright's own `dev:api:test`, not a Docker
      # container) at the postgres service just started above, as app_user (least-privilege
      # runtime role, changeset 0031).
      - run: >
          npx tsx scripts/ci/run-check.ts --name "E2E functional tests (shard ${{ matrix.shard }}/4)" --meta .ci-out/e2e/meta.json --
          npm run test:e2e:functional -- --reporter=list,json
          --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-out/e2e/e2e-results.json
          DATABASE_URL: postgresql://app_user:P%40ssw0rd@localhost:5432/reconciliation_platform
          DISABLE_API_RATE_LIMIT: 'true'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-functional-${{ matrix.shard }}
          path: .ci-out/e2e
          if-no-files-found: warn

  e2e-visual:
    runs-on: ubuntu-latest
    # No shard matrix: visual-baseline.spec.ts is one file, and its own internal parallel mode
    # (P5) already spreads its tests across workers inside the single container run below --
    # sharding across multiple runners would just mean N cold container builds instead of one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        # compose.e2e.yaml bind-mounts the repo root over the container's /app and relies on an
        # anonymous volume to shadow just /app/node_modules with the image's own npm-ci'd
        # install. On a fresh runner (fresh checkout, fresh anonymous volume) that shadow's
        # auto-populate-from-image doesn't reliably happen -- first confirmed via
        # docker-validate.yml's e2e-visual job, and reproduced identically here on this job's own
        # first-ever live run (Vite reporting an unresolvable "react-router" import -- a real
        # dependency, not an app bug). Installing here means the bind-mounted node_modules the
        # container actually sees is this real, complete install -- and since this runner is
        # already Linux, same as the container image, there's no ABI mismatch to protect against
        # the way there is on a macOS dev machine.
        run: npm ci
      - name: Pre-create the output directory
        # The visual-e2e container runs as root internally, and PLAYWRIGHT_JSON_OUTPUT_NAME below
        # points inside .ci-out/e2e-visual -- via compose.e2e.yaml's bind mount, whichever process
        # creates that directory FIRST owns it on the host. Without this step, the container
        # creates it (as root) while writing its own JSON report, and run-check.ts's later attempt
        # to write meta.json into that same now-root-owned directory (as this job's unprivileged
        # runner user) fails with EACCES -- confirmed on this job's own first-ever live run, after
        # fixing the earlier node_modules issue above let it get this far. Creating it here first
        # means the directory itself stays runner-owned even after root writes a file into it --
        # root can still write into a directory it doesn't own (root bypasses permission checks),
        # but that doesn't change who owns the directory itself.
        run: mkdir -p .ci-out/e2e-visual
      - run: >
          npx tsx scripts/ci/run-check.ts --name "E2E visual tests" --meta .ci-out/e2e-visual/meta.json --
          docker compose -f compose.e2e.yaml --profile e2e-visual run --rm visual-e2e
          npm run test:e2e:visual -- --reporter=list,json
        env:
          # Read inside the container by playwright.config.ts's use of process.env -- compose.e2e.yaml
          # doesn't declare this itself, so it must be passed through from the invoking shell here.
          PLAYWRIGHT_JSON_OUTPUT_NAME: .ci-out/e2e-visual/e2e-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-visual
          path: .ci-out/e2e-visual
          if-no-files-found: warn

  aggregate:
    needs:
      [unit, integration, postgres, lint, typecheck, coverage, complexity, dependencies, security, secrets, e2e-functional, e2e-visual]
    if: always() # publish whatever succeeded even if one or more check jobs failed or timed out
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN defaults to read-only in this org (confirmed via the job log's own
    # "GITHUB_TOKEN Permissions: Contents: read" banner) -- without this, every publish attempt
    # fails with "Write access to repository not granted" (403) on `git push`, regardless of
    # whether the commit itself succeeds. Scoped to just this job, not the whole workflow: the
    # other 7 jobs never touch the repo's contents and don't need write access.
    #
    # Listing ANY permission here switches this job from "inherit repo default" to an allowlist --
    # everything not named drops to `none`, not the repo default. That silently broke `gh pr list`
    # (used for openPrCount and the branches panel's PR lookup) the moment `contents: write` was
    # added: pull-requests had no explicit grant, so it dropped to none right along with it. Both
    # calls were failing silently (empty .catch()), which is why this went unnoticed until now.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.TARGET_BRANCH }}
          fetch-depth: 0 # full history -- commitsThisWeek/branch-compare/tag lookups need it
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unit
          path: .ci-artifacts/unit
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: integration
          path: .ci-artifacts/integration
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: postgres
          path: .ci-artifacts/postgres
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: lint
          path: .ci-artifacts/lint
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: typecheck
          path: .ci-artifacts/typecheck
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage
          path: .ci-artifacts/coverage
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: complexity
          path: .ci-artifacts/complexity
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dependencies
          path: .ci-artifacts/dependencies
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: security
          path: .ci-artifacts/security
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: secrets
          path: .ci-artifacts/secrets
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-functional-1
          path: .ci-artifacts/e2e-functional-1
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-functional-2
          path: .ci-artifacts/e2e-functional-2
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-functional-3
          path: .ci-artifacts/e2e-functional-3
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-functional-4
          path: .ci-artifacts/e2e-functional-4
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-visual
          path: .ci-artifacts/e2e-visual

      - name: Merge e2e shards
        # Combines the 4 functional shards and the single visual result back into the one
        # .ci-artifacts/e2e/ layout aggregate-dashboard-status.ts expects, so that script stays
        # lane/shard-agnostic and keeps reporting one "E2E tests" dashboard entry.
        if: always()
        run: >
          npx tsx scripts/ci/merge-e2e-shards.ts --artifacts .ci-artifacts
          --dirs e2e-functional-1,e2e-functional-2,e2e-functional-3,e2e-functional-4,e2e-visual
          --out .ci-artifacts/e2e

      - name: Aggregate results
        # Belt-and-suspenders alongside continue-on-error above: a download that genuinely found
        # nothing (a job that never uploaded anything, e.g. killed by its own timeout before
        # reaching the upload step) must not skip this -- aggregate-dashboard-status.ts's
        # readCheckMeta() already reports a missing meta.json as a clearly-labeled failure rather
        # than crashing, so partial data always beats no data.
        if: always()
        run: npx tsx scripts/ci/aggregate-dashboard-status.ts --env ${{ env.TARGET_BRANCH }} --artifacts .ci-artifacts --out dashboard-status/${{ env.TARGET_BRANCH }}.json
        env:
          GH_TOKEN: ${{ github.token }}

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-status-${{ env.TARGET_BRANCH }}
          path: dashboard-status/${{ env.TARGET_BRANCH }}.json
          retention-days: 14

      - name: Publish to status-data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "dashboard-status/${{ env.TARGET_BRANCH }}.json" ]; then
            echo "No status file produced -- aggregate-dashboard-status.ts crashed before writing output. Not publishing." >&2
            exit 1
          fi

          RESULT_FILE="$(pwd)/dashboard-status/${{ env.TARGET_BRANCH }}.json"
          TARGET_PATH="dashboard-status/${{ env.TARGET_BRANCH }}.json"

          PUBLISH_DIR="$(mktemp -d)"
          git clone --branch status-data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR" 2>/dev/null \
            || git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH_DIR"

          cd "$PUBLISH_DIR"
          # Must run after `cd` -- git config without --global only applies to the repo in the
          # current working directory, and this repo (the fresh status-data clone) is a different
          # one from the checkout root these commands used to run in. That mismatch is exactly
          # what caused "empty ident name" / "Author identity unknown" on the first real run.
          git config user.name "dashboard-status-bot"
          git config user.email "dashboard-status-bot@users.noreply.github.com"
          git checkout status-data 2>/dev/null || git checkout --orphan status-data

          attempt=1
          while true; do
            mkdir -p dashboard-status
            cp "$RESULT_FILE" "$TARGET_PATH"
            git add "$TARGET_PATH"

            if git diff --staged --quiet; then
              echo "No change to $TARGET_PATH -- skipping commit."
              break
            fi

            git commit -m "dashboard-status(${{ env.TARGET_BRANCH }}): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if git push origin status-data; then
              break
            fi

            if [ "$attempt" -ge 5 ]; then
              echo "Failed to push to status-data after $attempt attempts." >&2
              exit 1
            fi

            echo "Push rejected (attempt $attempt) -- pulling and retrying."
            git fetch origin status-data
            git reset --soft origin/status-data
            attempt=$((attempt + 1))
          done
