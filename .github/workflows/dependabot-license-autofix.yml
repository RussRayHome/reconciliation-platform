name: Dependabot License Manifest Autofix

# Dependabot bumps package.json/package-lock.json but has no way to run our custom
# licenses:generate script, so every Dependabot PR that touches a dependency fails
# Docker Validate's security-scan job on a stale generated/dependency-licenses.generated.json.
# This regenerates and pushes the fix straight to the PR branch so the manifest is
# already correct by the time Docker Validate runs (or re-runs).
#
# Note: a commit pushed here with GITHUB_TOKEN does NOT trigger a new pull_request
# event (GitHub suppresses workflow-triggered-by-workflow-token re-runs to prevent
# loops). Docker Validate's run for the new commit is still CREATED, but parks at
# conclusion=action_required and never starts -- leaving the PR blocked on required
# checks that never ran (observed on PR #270: 0 check runs against a head requiring
# 10). The final step below reruns those stuck runs itself rather than waiting for a
# human to notice, which is the same fix regenerate-visual-baselines.yml already uses.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  # `gh run rerun` in the final step needs this; contents:write alone is not enough.
  actions: write

jobs:
  autofix:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Neutralise this checkout's local git hooks
        # `npm ci` above runs the root "prepare" script, which sets core.hooksPath=.githooks, so
        # the `git push` below would fire .githooks/pre-push -> `npm run verify:push` -- the full
        # local CI mirror, including the Docker-stack deploy-cleanup test (Issue #180). That hook
        # guards a human's push; here it is pure duplicated work that can only block or hang the
        # autofix. Confirmed as the cause of a 16-minute hang on regenerate-visual-baselines.yml
        # (run 33273647800), which has the same npm-ci-then-push shape.
        run: git config --unset-all core.hooksPath || true

      - run: npm run licenses:generate

      - name: Commit and push if the manifest changed
        id: commit_and_push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- generated/dependency-licenses.generated.json; then
            echo "License manifest already up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/dependency-licenses.generated.json
          git commit -m "chore(deps): regenerate license manifest [autofix]"
          git push origin "HEAD:${HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Re-trigger CI stuck on this push
        # Only reachable when we actually pushed: with no push there is no new SHA and
        # nothing is stuck. Polls rather than checking once because the runs for a new
        # SHA are not registered instantly. Exits 0 when nothing is stuck, so a PR whose
        # manifest was already correct never fails here.
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_sha="$(git rev-parse HEAD)"
          echo "Waiting for GitHub to register workflow runs for $new_sha..."

          stuck=""
          for _ in $(seq 1 12); do
            sleep 5
            stuck=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${new_sha}&per_page=50" \
              --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id')
            if [ -n "$stuck" ]; then
              break
            fi
          done

          if [ -z "$stuck" ]; then
            echo "No workflow runs stuck in action_required for $new_sha -- nothing to rerun."
            exit 0
          fi

          for id in $stuck; do
            echo "Re-running stuck workflow run $id"
            gh run rerun "$id"
          done
