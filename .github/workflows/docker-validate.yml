name: Docker Validate

on:
  pull_request:
  push:
    branches:
      - main

# Without this, a duplicate/near-simultaneous pull_request event (observed twice on PR #146 the
# same night this workflow's jobs got their per-step timeouts, ~1s apart, identical head SHA)
# spins up two full, independent runs of every job below -- doubling real CI cost for zero
# additional signal, since only the latest run against a given ref ever matters. Cancels a
# same-ref run in favor of a newer one; different refs (separate PRs) never share a group, so this
# never cancels unrelated work.
concurrency:
  group: docker-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # nginx-config.test.ts's "is valid" test needs this image locally -- without a pre-pull, it
      # was silently skipping on every CI run (drift review finding #01: hasLocalDockerImage()
      # ? it : it.skip, and this image was never pulled here). Inverting that skip (dockerGate)
      # made the missing image a loud failure instead of a silent pass; this step is what actually
      # makes the test able to run for real in CI, not just fail loudly instead of skip quietly.
      - name: Pull nginx test image
        run: docker pull nginxinc/nginx-unprivileged:mainline-alpine

      - name: Run unit and integration tests
        run: npm run test

  # Drift review finding #02: `npm run test` above selects unit-core/unit-web/integration, never
  # unit-data (packages/persistence/tests/**) -- the project the schema baseline (1,621 exact-set
  # pgTap assertions) and the RLS isolation tests actually live in. Before this job, the only
  # place those ran was dashboard-status.yml's own `postgres` job, which is nightly-plus-push-to-
  # dev, not a PR gate -- a schema-breaking change could merge and only be caught after the fact.
  # Mirrors that job's own steps (self-contained via testcontainers in globalSetup.ts; no separate
  # `docker compose up postgres` needed here, unlike e2e-functional below).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres-backed persistence tests
        run: npm run test:postgres

  e2e-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast defaults to true here (unlike dashboard-status.yml's e2e-functional, which sets
      # it false) -- that job exists to report full status to a dashboard regardless of any one
      # shard's outcome; this one exists to gate a merge, where one failing shard already means
      # the PR is blocked and there's no reason to spend the other shards' CI minutes finding out
      # what else might also be broken.
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # File Imports & Validation (Phase 6+) has no in-memory fallback for the import pipeline --
      # unlike the older atomic /api/reconciliation/run route, POST /api/imports/runs always needs
      # a real Postgres connection. This job used to run against an in-memory backend
      # (ALLOW_LOCAL_LOGIN_FALLBACK) matching the old route's own fallback; that stopped being
      # sufficient once Screen 01 (Phase 9) made the import pipeline the default landing flow.
      # Reuses compose.yaml's own postgres+migrate services (isolated project name per shard,
      # default port -- each matrix shard gets its own fresh runner VM, so there's no real
      # collision risk) rather than a bespoke recipe -- same one used to validate this feature's
      # E2E suite locally before this workflow existed.
      - name: Start Postgres and run migrations
        run: |
          set -euo pipefail
          # Written with printf, not a heredoc -- this step's own indentation (preserved literally
          # inside YAML's `|` block) would otherwise land in the middle of the file's content and
          # break an exact-match heredoc terminator.
          printf '%s\n' \
            'POSTGRES_DB=reconciliation_platform' \
            'POSTGRES_USER=recon_app' \
            'POSTGRES_PASSWORD=change-ci-password' \
            'POSTGRES_HOST_PORT=5432' \
            'ENABLE_PGAUDIT=false' \
            'API_DATABASE_URL=unused' \
            'JWT_SECRET=unused-ci-placeholder' \
            > ci-e2e.env
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} up -d postgres --wait
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} run --rm migrate
          docker compose -f compose.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} exec -T postgres \
            psql -U recon_app -d reconciliation_platform < scripts/db/dev-stage/create-users.psql

      # DISABLE_API_RATE_LIMIT: the route-sweep and signup specs (ISSUE-026/ISSUE-033) each do
      # real logins in sequence -- against a local Postgres, this reproducibly tripped the API's
      # 120-requests/minute rate limit (a real 429 on /api/auth/me, confirmed via the failing
      # run's network trace) once total e2e request volume crossed that threshold. The limiter is
      # generic Express middleware applying regardless of persistence backend. Safe to disable for
      # this job specifically: DISABLE_API_RATE_LIMIT has no production-safety guard of its own,
      # but this env var only ever reaches the ephemeral webServer this job spawns for itself,
      # never a deployed instance.
      #
      # DATABASE_URL points the webServer that runs inside the functional-e2e container (Playwright's
      # own `dev:api:test`, spawned as a child process of the containerized test run -- see
      # compose.e2e.yaml) at the postgres service just started above, as app_user (least-privilege
      # runtime role, changeset 0031) -- matches API_DATABASE_URL's shape everywhere else in this
      # repo. Hostname is `postgres` (the compose network name), not `localhost` -- this test run
      # no longer executes on the bare runner, so the host-mapped port isn't reachable from inside
      # the container; this step and functional-e2e both run joined to the same compose project
      # (`-p ...`) so they share that network and can resolve it by name.
      #
      # Normal retry policy (retries: process.env.CI ? 2 : 0, from playwright.config.ts) -- not
      # dashboard-status.yml's --max-failures=1 --retries=0, which that file's own comment marks
      # explicitly temporary/triage-only. A required merge gate should retry ordinary flakiness
      # the same way any other check here would, not fail-fast on the first flake.
      #
      # No more `npx playwright install --with-deps chromium` step here -- compose.e2e.yaml's
      # functional-e2e service runs inside docker/e2e-functional.Dockerfile, which bakes the
      # browser and its OS dependencies in at build time instead of installing them on every job
      # run. See dashboard-status.yml's identical comment for the incident that motivated this.
      - name: Run functional E2E tests
        # --reporter=list, explicit: Playwright's default is 'dot' outside a TTY, which is much
        # harder to debug from a CI log than list's per-test lines when this job fails.
        run: >
          docker compose -f compose.yaml -f compose.e2e.yaml --env-file ci-e2e.env -p reconciliation-platform-ci-e2e-${{ matrix.shard }} --profile e2e-functional
          run --rm functional-e2e npm run test:e2e:functional -- --reporter=list --shard=${{ matrix.shard }}/4
        env:
          DATABASE_URL: postgresql://app_user:P%40ssw0rd@postgres:5432/reconciliation_platform
          DISABLE_API_RATE_LIMIT: 'true'

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-functional-${{ matrix.shard }}-failure
          path: test-results/e2e
          if-no-files-found: ignore

  visual-path-check:
    # Gates e2e-visual below on D4 (UI-testing breakout plan): run on every PR except the
    # existing inert-path exclusions dashboard-status.yml already uses. Deliberately NOT filtered
    # to apps/web/** -- packages/ui or a dependency bump can shift rendering too, so anything
    # outside issue_tracker/**, docs/**, and **.md counts as "real" for this check.
    #
    # No top-level `if:` -- this job always runs and always produces a real true/false output,
    # rather than conditionally skipping itself for non-PR events. A downstream job (`needs:`)
    # depending on a job that was SKIPPED (not failed) is skipped by default unless its own `if:`
    # explicitly overrides that -- simpler and less error-prone to just always run this cheap
    # check and let its own logic decide, than to rely on getting that skip-propagation subtlety
    # right with no way to dry-run it locally (no `act` available).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_visual: ${{ steps.check.outputs.run_visual }}
    steps:
      - name: Determine whether only inert paths changed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event -- always running the visual lane."
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail open toward RUNNING the visual lane, not skipping it: a wasted run only costs a
          # few CI minutes, but a wrongly-skipped run silently creates a gap in the soak record
          # D3's "2 weeks of active development" depends on -- much harder to notice after the
          # fact than a few extra green runs.
          if ! CHANGED=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only 2>&1); then
            echo "Could not determine changed files (gh pr diff failed: $CHANGED) -- running visual lane to be safe."
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NON_INERT=$(echo "$CHANGED" | grep -vE '^(issue_tracker/|docs/|.*\.md$)' || true)

          if [ -z "$NON_INERT" ]; then
            echo "Every changed file matches an inert path (issue_tracker/**, docs/**, **.md) -- skipping visual lane."
            echo "run_visual=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-visual:
    needs: visual-path-check
    if: needs.visual-path-check.outputs.run_visual == 'true'
    runs-on: ubuntu-latest
    # Non-blocking (D3's soak): continue-on-error means a failure here shows as a distinct
    # neutral indicator on the PR, not a red X -- accurately signaling "not yet a merge gate,
    # currently being soaked" rather than looking like an ordinary broken check. Not in
    # scripts/github-branch-protection.ts's required-checks array either (deliberately, see the
    # P8 commit/PR), so it can't block a merge regardless -- this is belt-and-suspenders on how
    # it's *displayed*, not what actually gates.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        # compose.e2e.yaml bind-mounts the repo root over the container's /app and relies on an
        # anonymous volume to shadow just /app/node_modules with the image's own npm-ci'd
        # install (avoiding a host/container ABI mismatch on a developer's Mac). On a genuinely
        # fresh runner -- fresh checkout, fresh anonymous volume, no prior local Docker state --
        # that volume's auto-populate-from-image never ran here in practice: the first real CI
        # trigger of this job failed every single test at the very first `page.goto('/')`, with
        # Vite's own dev-server overlay reporting `Failed to resolve import "react-router"` --
        # i.e. node_modules was effectively empty inside the container, not an app or dependency
        # bug (react-router is a real dependency, apps/web/package.json:21). Installing here on
        # the Linux runner sidesteps the whole shadow-volume question: this IS already the same
        # OS as the container image, so there's no ABI mismatch to protect against in CI the way
        # there is on a macOS dev machine, and the bind-mounted node_modules the container sees
        # is simply this real, complete install.
        run: npm ci

      - name: Run visual E2E tests
        # Runs inside docker/e2e-visual.Dockerfile via compose.e2e.yaml. Docker is preinstalled
        # on GitHub-hosted ubuntu-latest runners. First run on a fresh runner builds the image
        # from scratch (no registry cache configured yet) -- a real cost, tracked as a known
        # follow-up, not solved here.
        run: docker compose -f compose.e2e.yaml --profile e2e-visual run --rm visual-e2e npm run test:e2e:visual -- --reporter=list

      - name: Upload diff artifacts
        # The PNG diff is the code review (per the plan's own standing convention) -- this upload
        # is what makes that diff inspectable when this check fails, since GitHub doesn't render
        # images from a job log. test-results/e2e matches playwright.config.ts's outputDir; the
        # container writes there via its bind mount (compose.e2e.yaml), so it's already on the
        # runner's own filesystem by the time this step runs, same as e2e-functional's upload above.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-visual-diff
          path: test-results/e2e
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        run: npm run security:scan

      - name: Check production dependency licenses
        run: npm run licenses:check

  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate static checks
        run: npm run typecheck && npm run lint && npm run docs:api:check && npm run docs:openapi:check

      - name: Render Compose config
        run: docker compose --env-file .env.docker.dev.fallback -f compose.yaml config >/tmp/reconciliation-compose-config.txt

      - name: Build container images
        run: docker compose --env-file .env.docker.dev.fallback -f compose.yaml build

      - name: Scan container images for vulnerabilities
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
          project="${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}"
          # "data" is compose.yaml's internal network, not a buildable service -- there is no
          # "${project}-data" image, so scanning it here always failed once every real
          # image made it this far. --scanners vuln keeps this step to what its name says
          # (vulnerabilities): apps/web/Dockerfile bakes a throwaway self-signed dev TLS cert
          # into every build (openssl-generated at build time, never a real secret), which
          # Trivy's default secret scanner otherwise flags -- redundant anyway, since secret
          # scanning is already covered by the dedicated gitleaks/trufflehog pipeline (see
          # Secret Integrity on the Developer Dashboard).
          # .trivyignore covers the migrate image's bundled-but-out-of-our-control surface
          # (Go stdlib and Ubuntu base packages baked into liquibase/liquibase:4.33.0, plus
          # Jackson/postgresql-jdbc that Liquibase itself bundles and uses) -- each entry
          # expiry-dated, same convention as scripts/ops/db-cve-allowlist.txt. Applying it to
          # every image is harmless: api/web have no findings for it to match against.
          for image in "${project}-api" "${project}-web" "${project}-migrate"; do
            echo "Scanning ${image}"
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --scanners vuln \
              --ignorefile .trivyignore "${image}"
          done

      - name: Run container smoke test
        env:
          DOCKER_ENV_FILE: .env.docker.dev.fallback
        run: npm run docker:smoke

  zap-web-stage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The hand-rolled curl|apt-get install this replaced fetched Node from an external Debian
      # mirror (deb.nodesource.com) via apt, which apt itself routes through
      # azure.archive.ubuntu.com/archive.ubuntu.com -- the exact same external-mirror dependency
      # that caused e2e-functional's install-step hang (2026-08-19 nightly, PR #144/#145). That
      # step got a 5-minute timeout as a stopgap, but this job's own equivalent step then hung on
      # the identical mirror twice in a row the same night (once past even that timeout), because
      # bounding the failure doesn't remove the dependency causing it. actions/setup-node pulls
      # Node from GitHub's own release CDN instead of an apt mirror at all -- the same fix
      # dashboard-status.yml's jobs already use, with no apt-get/mirror dependency to hang on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Stage stack
        run: npm run docker:deploy:stage

      - name: Run OWASP ZAP baseline scan (Stage web)
        run: npm run security:scan:zap:web:stage

      - name: Run OWASP ZAP baseline scan (Stage API)
        run: npm run security:scan:zap:api:stage

      - name: Package OWASP ZAP artifacts
        if: always()
        run: |
          set -euo pipefail
          if [ -d test-results/security/zap-web-stage ] || [ -d test-results/security/zap-api-stage ]; then
            tar -czf test-results/security/zap-stage-report.tgz \
              test-results/security/zap-web-stage \
              test-results/security/zap-api-stage
            echo "Created test-results/security/zap-stage-report.tgz"
          else
            echo "No ZAP report directories found to package."
          fi

      - name: Cleanup Stage stack
        if: always()
        run: npm run docker:cleanup:stage
