name: Docker Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static checks
        run: npm run typecheck && npm run lint

      - name: Render Compose config
        run: docker compose --env-file .env.docker.example -f compose.yaml config >/tmp/reconciliation-compose-config.txt

      - name: Build container images
        run: docker compose --env-file .env.docker.example -f compose.yaml build

      - name: Run container smoke test
        env:
          DOCKER_ENV_FILE: .env.docker.example
        run: npm run docker:smoke