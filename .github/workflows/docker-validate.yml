name: Docker Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm run test

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        run: npm run security:scan

  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate static checks
        run: npm run typecheck && npm run lint && npm run docs:api:check && npm run docs:openapi:check

      - name: Render Compose config
        run: docker compose --env-file .env.docker.dev.fallback -f compose.yaml config >/tmp/reconciliation-compose-config.txt

      - name: Build container images
        run: docker compose --env-file .env.docker.dev.fallback -f compose.yaml build

      - name: Scan container images for vulnerabilities
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
          project="${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}"
          for image in "${project}-api" "${project}-web" "${project}-migrate" "${project}-data"; do
            echo "Scanning ${image}"
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "${image}"
          done

      - name: Run container smoke test
        env:
          DOCKER_ENV_FILE: .env.docker.dev.fallback
        run: npm run docker:smoke

  zap-web-stage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Deploy Stage stack
        run: npm run docker:deploy:stage

      - name: Run OWASP ZAP baseline scan (Stage web)
        run: npm run security:scan:zap:web:stage

      - name: Run OWASP ZAP baseline scan (Stage API)
        run: npm run security:scan:zap:api:stage

      - name: Package OWASP ZAP artifacts
        if: always()
        run: |
          set -euo pipefail
          if [ -d test-results/security/zap-web-stage ] || [ -d test-results/security/zap-api-stage ]; then
            tar -czf test-results/security/zap-stage-report.tgz \
              test-results/security/zap-web-stage \
              test-results/security/zap-api-stage
            echo "Created test-results/security/zap-stage-report.tgz"
          else
            echo "No ZAP report directories found to package."
          fi

      - name: Cleanup Stage stack
        if: always()
        run: npm run docker:cleanup:stage
