name: Regenerate Visual Baselines

# The only sanctioned way to update apps/web/tests/e2e/visual/visual-baseline.spec.ts-snapshots/.
# Manually dispatched against a PR branch (pick the branch as this workflow's "Use workflow from"
# ref in the Actions UI) -- never automatic, and never against `dev` directly (guarded below).
# Regenerating inside the P4 container is what P4 built that container FOR: baselines recorded on
# a developer's own macOS/Windows machine reintroduce exactly the cross-platform divergence P4
# removed (see docker-validate.yml's e2e-visual job and docker/e2e-visual.Dockerfile).
on:
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # 20 was inherited from docker-validate.yml's e2e-visual job, but that job only *compares*
    # snapshots and is short-circuited by visual-path-check. Regeneration starts the whole compose
    # stack and re-renders every baseline, which took 5m37s on run 33273647800 -- the 20-minute
    # overrun on run 33271984066 was never the render; it was the pre-push hook this job used to
    # inherit from `npm ci` (see the "Neutralise this checkout's local git hooks" step below).
    # Manually dispatched and rare, so a generous ceiling still costs nothing.
    timeout-minutes: 45
    # GITHUB_TOKEN defaults to read-only in this org (confirmed on dashboard-status.yml's
    # `aggregate` job -- see its comment) -- without this, the push step below fails with
    # "Write access to repository not granted" regardless of whether the commit itself succeeds.
    # actions:write is for the "Re-trigger CI stuck on this push" step below -- gh run rerun needs
    # it to unstick the pull_request-event run that our own GITHUB_TOKEN-authenticated push can't
    # trigger on its own (see that step's comment).
    permissions:
      contents: write
      actions: write
    steps:
      - name: Refuse to run against dev
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Refusing to regenerate baselines directly against dev -- dispatch this workflow from a PR branch instead, so the regenerated PNGs go through review like any other baseline update." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        # compose.e2e.yaml bind-mounts the repo root over the container's /app and relies on an
        # anonymous volume to shadow just /app/node_modules with the image's own npm-ci'd
        # install. On a fresh runner (fresh checkout, fresh anonymous volume) that shadow's
        # auto-populate-from-image doesn't reliably happen -- confirmed via docker-validate.yml's
        # e2e-visual job, whose first real CI run failed every test at the very first page load
        # with Vite reporting an unresolvable "react-router" import (a real dependency, not an
        # app bug). Installing here means the bind-mounted node_modules the container actually
        # sees is this real, complete install -- and since this runner is already Linux, same as
        # the container image, there's no ABI mismatch to protect against the way there is on a
        # macOS dev machine.
        run: npm ci

      - name: Neutralise this checkout's local git hooks
        # `npm ci` above runs the root "prepare" script, which sets core.hooksPath=.githooks.
        # That makes this job's own `git push` below fire .githooks/pre-push, whose entire body is
        # `npm run verify:push` -- typecheck, lint, the docs/licence drift checks, and the full
        # unit + integration suite including the Docker-stack deploy-cleanup test (Issue #180).
        # Six minutes when it passes (measured on run 32842343171, which paid it silently); on run
        # 33273647800 it was still running 16 minutes in, and the retry loop below re-runs it once
        # per attempt, so a failing hook cannot fit inside any timeout. The hook exists to stop a
        # human pushing unverified work -- this push's whole purpose is to trigger exactly those
        # checks on the PR, so running them here is duplicated work that can only ever block.
        run: git config --unset-all core.hooksPath || true

      - name: Regenerate baselines inside the P4 container
        run: npm run test:e2e:visual:container:update-snapshots

      - name: Commit and push regenerated baselines
        id: commit_and_push
        env:
          SNAPSHOT_DIR: apps/web/tests/e2e/visual/visual-baseline.spec.ts-snapshots
        run: |
          set -euo pipefail
          git config user.name "visual-baseline-bot"
          git config user.email "visual-baseline-bot@users.noreply.github.com"

          # Scoped to just the snapshot dir, not `git add -A` -- this workflow's only sanctioned
          # job is regenerating baselines; anything else that changed (a dirty container, a stray
          # file) should surface as a review question, not get silently swept into this commit.
          git add "$SNAPSHOT_DIR"

          if git diff --staged --quiet; then
            echo "No baseline changes -- visual output already matches committed baselines."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "test(visual): regenerate baselines via P4 container"

          # Same retry pattern as dashboard-status.yml's proven `Publish to status-data branch`
          # step: on a rejected push, reset (not rebase) onto the new remote tip and recommit --
          # our regenerated PNGs are a full, deterministic re-render from this run's container, so
          # "ours wins" is the right merge policy here, same as that step's regenerated JSON file.
          attempt=1
          while true; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -ge 5 ]; then
              echo "Failed to push regenerated baselines after $attempt attempts." >&2
              exit 1
            fi

            echo "Push rejected (attempt $attempt) -- pulling and retrying."
            git fetch origin "${{ github.ref_name }}"
            git reset --soft "origin/${{ github.ref_name }}"
            git add "$SNAPSHOT_DIR"

            if git diff --staged --quiet; then
              echo "Remote branch already has this exact regeneration -- nothing left to push."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "test(visual): regenerate baselines via P4 container"
            attempt=$((attempt + 1))
          done

      - name: Re-trigger CI stuck on this push
        # A push authenticated with the default GITHUB_TOKEN cannot itself trigger new
        # pull_request-event workflow runs -- GitHub's anti-recursion protection against a
        # workflow's own push chaining into another workflow run indefinitely. In practice this
        # means the docker-validate.yml run this push should have kicked off for the PR gets
        # created but sits at conclusion=action_required until a real actor reruns it, which
        # otherwise silently blocks the PR on a check that never actually ran. Do that rerun here
        # instead of relying on someone to notice.
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_sha="$(git rev-parse HEAD)"
          echo "Waiting for GitHub to register workflow runs for $new_sha..."

          stuck=""
          for _ in $(seq 1 12); do
            sleep 5
            stuck=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${new_sha}&per_page=50" \
              --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id')
            if [ -n "$stuck" ]; then
              break
            fi
          done

          if [ -z "$stuck" ]; then
            echo "No workflow runs stuck in action_required for $new_sha -- nothing to rerun."
            exit 0
          fi

          for id in $stuck; do
            echo "Re-running stuck workflow run $id"
            gh run rerun "$id"
          done

      - name: Upload regenerated baselines for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          retention-days: 14  # a human downloads this to apply the baselines
          name: regenerated-visual-baselines
          path: apps/web/tests/e2e/visual/visual-baseline.spec.ts-snapshots
          if-no-files-found: ignore
