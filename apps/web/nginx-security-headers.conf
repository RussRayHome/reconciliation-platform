# Included explicitly by the static-content locations (`/`, `/assets/`) in nginx.conf -- never at
# server{} scope. `add_header` is inherited by a location only when that location defines none of
# its own; both `/` and `/assets/` already need their own Cache-Control add_header, which would
# otherwise silently drop every header below for those two locations alone (confirmed live: a
# ZAP re-scan surfaced them as newly missing the first time this was tried, see nginx.conf's own
# history). The API's proxy locations (`/api/`, the SSE route, pgweb) deliberately do NOT include
# this file: leaving them free of any add_header means nginx has nothing to inherit there, so the
# upstream's own headers (Express/helmet's, or pgweb's) pass through untouched instead of getting
# a second, differently-worded copy appended alongside them -- confirmed live via curl that
# without this split, /api/health carried two Content-Security-Policy headers, two
# Cross-Origin-Resource-Policy headers (API's intentional `cross-origin` next to this file's
# `same-origin`), and two Referrer-Policy headers (API's `no-referrer` next to this file's
# `no-referrer-when-downgrade`) -- a real, previously-undiscovered gap this file's introduction
# closes, not a hypothetical one.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer-when-downgrade always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Embedder-Policy credentialless always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
