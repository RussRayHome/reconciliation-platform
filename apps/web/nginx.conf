# Structured JSON access log so a local Loki/Promtail stack (compose.observability.yaml, Dev/Stage
# only) can ingest it the same way it ingests every other container's pino JSON output. nginx has
# no notion of the application's JWT, so this can never carry the session id (`jti`) that
# correlates the rest of a session's activity -- it stays a separate, IP/method/path/status-only
# stream. This file lands at /etc/nginx/conf.d/default.conf (see apps/web/Dockerfile), included
# inside the base image's http{} block, so log_format is valid here even though it sits alongside
# a server{} block rather than inside one.
log_format json_access escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"'
  '}';

server {
  listen 8080;
  listen 8443 ssl;
  server_name _;
  access_log /dev/stdout json_access;

  # Local-dev self-signed cert (scripts/pre-flight/generate-dev-cert.sh). Browsers will show an
  # untrusted-cert warning until manually trusted — expected until a real CA-issued cert replaces
  # this for staged/production deploys.
  ssl_certificate /etc/nginx/certs/dev-cert.pem;
  ssl_certificate_key /etc/nginx/certs/dev-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  # Every source directive pins to 'self' -- there is no legitimate reason for this app to load a
  # script/style/font/image/connection from anywhere but its own origin. This is the browser-
  # enforced backstop for the class of bug ISSUE-110 fixed (an @import of Google-hosted fonts
  # caused an intermittent visual-regression CI failure): even if a future change reintroduces an
  # external asset reference, the browser refuses to load it instead of silently succeeding.
  # style-src keeps 'unsafe-inline' because chart/tooltip libraries (Recharts) set inline `style=`
  # attributes for computed positioning -- CSP's style-src governs those too, not just <style>
  # tags, and a stricter nonce-based approach isn't in place yet.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
  add_header Cross-Origin-Embedder-Policy credentialless always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Reconciliation runs are synchronous CPU-bound work that can take several
    # minutes on large workbooks; a short read timeout here prevents nginx from
    # 504ing the client while the API is still processing.
    proxy_read_timeout 1200s;
  }

  location ~ ^/(?<env_segment>[A-Za-z0-9_-]+)/pgweb$ {
    return 302 $scheme://$http_host/$env_segment/pgweb/;
  }

  location ~ ^/[A-Za-z0-9_-]+/pgweb(?:/.*)?$ {
    set $pgweb_upstream http://pgweb:8081;
    rewrite ^/[A-Za-z0-9_-]+/pgweb/?(.*)$ /$1 break;
    proxy_pass $pgweb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    # add_header doesn't inherit from the server block once a location defines its own -- repeated
    # here for the same reason as the server-level copy above (ISSUE-110).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}