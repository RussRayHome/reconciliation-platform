services:
  postgres:
    build:
      args:
        POSTGRES_BASE_IMAGE: postgres:16.14
        ENABLE_PGAUDIT: 'true'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      # ddl+role: schema changes and role/privilege/grant changes -- the "who changed what
      # privileged thing" questions ISSUE-047 exists to answer. Deliberately not `write`: that
      # would log every INSERT/UPDATE/DELETE from the app's normal reconciliation processing at
      # session level, which is volume, not signal, for a high-throughput workload. Auditing
      # writes to specific sensitive tables is pgaudit's separate object-level (pgaudit.role)
      # feature -- a distinctly scoped follow-up, not this changeset's job.
      - -c
      - pgaudit.log=ddl, role

  api:
    build:
      target: runtime
    volumes:
      - ./.git:/app/.git:ro
    environment:
      DEVELOPER_SKIP_DIRTY_CHECK: 'true'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'safe.directory'
      GIT_CONFIG_VALUE_0: '/app'
      # Issue #134 phase 4: Dev is where this topology gets exercised for real -- CI's smoke test
      # and E2E overlays deliberately stay on the synchronous fallback (compose.yaml's own
      # defaults), so this override is scoped to Dev only, not the shared base file.
      ENABLE_RECONCILIATION_QUEUE: 'true'
      ENABLE_IMPORT_VALIDATION_QUEUE: 'true'
      # Dev-only segregation-of-duty bypass (changeset 0056): lets a superuser submit and approve
      # the same import run for solo testing. Restated (restricted) before go-live -- app.ts
      # refuses to boot with this set in a production runtime, so it must never be copied into
      # compose.yaml.
      ALLOW_SUPERUSER_SELF_APPROVAL: 'true'

  worker:
    build:
      target: runtime
    environment:
      ENABLE_RECONCILIATION_QUEUE: 'true'
      ENABLE_IMPORT_VALIDATION_QUEUE: 'true'

  web:
    build:
      args:
        VITE_ENVIRONMENT_PATH_SEGMENT: 'dev'
    volumes:
      # Shadows the image's baked-in throwaway cert (apps/web/Dockerfile) with a persistent
      # host-generated one, so interactive dev doesn't get a new untrusted cert on every rebuild.
      # No `ports:` override needed here -- compose.yaml already publishes the HTTPS port by
      # default; see its own comment.
      - ./certs/dev:/etc/nginx/certs:ro
    # Overrides (not merges with) compose.yaml's healthcheck -- checks the actual HTTPS listener
    # dev publishes, not the unpublished plain-HTTP one, so this validates what's really reachable
    # from outside the container. --no-check-certificate is required for the self-signed dev cert.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-recon_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-reconciliation_platform}?sslmode=disable
    ports:
      - '${PGWEB_PORT:-8081}:8081'
    depends_on:
      - postgres
    networks:
      - default
      - app
      - data
      - edge
    restart: unless-stopped
    mem_limit: ${PGWEB_MEM_LIMIT:-256m}
    mem_reservation: ${PGWEB_MEM_RESERVATION:-64m}
    cpus: ${PGWEB_CPUS:-0.50}
    stop_grace_period: 30s

  nginx-ui:
    image: uozi/nginx-ui:2.5.10
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - '${NGINX_UI_HTTP_PORT:-8082}:9000'
    volumes:
      - recon-nginx-ui-data:/etc/nginx-ui
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge
    restart: unless-stopped
    mem_limit: ${NGINX_UI_MEM_LIMIT:-512m}
    mem_reservation: ${NGINX_UI_MEM_RESERVATION:-128m}
    cpus: ${NGINX_UI_CPUS:-1.00}
    stop_grace_period: 90s

volumes:
  recon-nginx-ui-data:
