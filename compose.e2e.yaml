services:
  visual-e2e:
    build:
      context: .
      dockerfile: docker/e2e-visual.Dockerfile
    # Never starts via a bare `docker compose up` -- only `--profile e2e-visual` opts in. This is
    # deliberate: the previous long-lived `tools` container being wedged once took the whole
    # Developer Dashboard down for hours (see dashboard-status.yml's header comment), so this is
    # always a one-shot `run --rm`, never a standing service.
    profiles:
      - e2e-visual
    environment:
      # Bare name (no value): passes the invoking shell's own PLAYWRIGHT_JSON_OUTPUT_NAME through
      # to the container unchanged, so CI (which sets it as a step-level env var) can control
      # where the JSON reporter writes without this file needing to know about CI specifically.
      # Unset locally -- harmless, Playwright just uses its default reporter/output path.
      - PLAYWRIGHT_JSON_OUTPUT_NAME
    volumes:
      # Live bind mount so edited spec files run immediately and --update-snapshots writes the new
      # baselines straight back to the host's git-tracked snapshot directory.
      - .:/app
      # Anonymous volume shadows the bind mount at node_modules specifically, so the container
      # keeps the Linux binaries npm ci installed at build time instead of inheriting the host's
      # (macOS) node_modules, which would be binary-incompatible (Chromium, native deps).
      - /app/node_modules
    command: npm run test:e2e:visual
