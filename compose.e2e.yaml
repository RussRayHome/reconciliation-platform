services:
  visual-e2e:
    build:
      context: .
      dockerfile: docker/e2e-visual.Dockerfile
    # Never starts via a bare `docker compose up` -- only `--profile e2e-visual` opts in. This is
    # deliberate: the previous long-lived `tools` container being wedged once took the whole
    # Developer Dashboard down for hours (see dashboard-status.yml's header comment), so this is
    # always a one-shot `run --rm`, never a standing service.
    profiles:
      - e2e-visual
    environment:
      # Bare name (no value): passes the invoking shell's own PLAYWRIGHT_JSON_OUTPUT_NAME through
      # to the container unchanged, so CI (which sets it as a step-level env var) can control
      # where the JSON reporter writes without this file needing to know about CI specifically.
      # Unset locally -- harmless, Playwright just uses its default reporter/output path.
      - PLAYWRIGHT_JSON_OUTPUT_NAME
    volumes:
      # Live bind mount so edited spec files run immediately and --update-snapshots writes the new
      # baselines straight back to the host's git-tracked snapshot directory.
      #
      # This mount is what makes the container's uid load-bearing: it replaces the image's own
      # /app (owned by pwuser) with the host checkout, so writes back into test-results/ and
      # blob-report/ succeed only because pwuser (uid 1001) matches GitHub's `runner` user (also
      # 1001). See docker/e2e-visual.Dockerfile's USER comment for the measurements and the fix if
      # that ever stops holding -- the escape hatch is a `user:` key on this service.
      - .:/app
      # Anonymous volume shadows the bind mount at node_modules specifically, so the container
      # keeps the Linux binaries npm ci installed at build time instead of inheriting the host's
      # (macOS) node_modules, which would be binary-incompatible (Chromium, native deps).
      - /app/node_modules
    command: npm run test:e2e:visual

  functional-e2e:
    build:
      context: .
      dockerfile: docker/e2e-functional.Dockerfile
    # Same defense-in-depth reasoning as visual-e2e above: always a one-shot `run --rm`, never a
    # standing service.
    profiles:
      - e2e-functional
    environment:
      # Bare names (no value): pass the invoking shell's own values through unchanged, same
      # pattern as visual-e2e's PLAYWRIGHT_JSON_OUTPUT_NAME passthrough above. DATABASE_URL must
      # point at the `postgres` service by its compose network hostname, not localhost -- this
      # container is not the host, so the port mapped out to the host's localhost isn't reachable
      # here. Both workflow files' e2e-functional jobs set these as step-level env vars, and this
      # service must run joined to the same compose project (`-p ...`) that already started
      # compose.yaml's `postgres`/`migrate` services, so it lands on that project's shared
      # `default` network and can resolve `postgres` by name.
      - DATABASE_URL
      - DISABLE_API_RATE_LIMIT
      - PLAYWRIGHT_JSON_OUTPUT_NAME
    volumes:
      # Same bind-mount + anonymous-volume node_modules shadow as visual-e2e above -- see that
      # service's comments for the two gotchas this depends on the workflow step order to avoid
      # (host npm ci before the container run; host mkdir -p of any output dir the container will
      # write into, before the container run).
      - .:/app
      - /app/node_modules
    command: npm run test:e2e:functional
