# Local Dev/Stage log+metrics aggregation -- deliberately a separate compose project from the app
# stack (compose.yaml/compose.dev.yaml/compose.stage.yaml). Not referenced by any CI workflow, not
# started by `npm run docker:deploy`, no depends_on relationship with the app in either direction.
# Alloy (observability/alloy/config.alloy) discovers and tails every container on this Docker host
# via the Docker Engine API (socket-mounted read-only below) -- it does not need to join the app's
# `edge`/`app`/`data` networks (`app`/`data` are `internal: true` in compose.yaml), and no app
# service definition needs to change for this to work. Replaces Promtail, which reached end of
# life 2026-03-02.
#
# Prometheus is the one exception -- scraping HTTP metrics genuinely requires network reachability
# to the target, unlike Promtail's socket-based log tailing. It joins both the Dev and Stage app
# networks (declared `external` below) purely to reach each stack's `api:4000/api/metrics` -- still
# no `depends_on`/build coupling in either direction, and still nothing in either app stack needs to
# change or know this exists. Requires the real Dev/Stage stacks (`npm run docker:deploy[:stage]`)
# to already be running -- Prometheus will just show whichever target as down otherwise, which
# doesn't block anything else in this file. The dashboard's own `$environment` variable already
# expected both (every panel already filters on `compose_project="$environment"`) -- only the
# single-network Prometheus scrape config was actually Dev-only before this.
#
# Usage:
#   docker compose -f compose.observability.yaml up -d
#   open http://localhost:3000   (Grafana; Loki + Prometheus datasources pre-provisioned)
#
# Example LogQL queries (Explore tab, or a dashboard panel):
#   {compose_project="reconciliation-platform-dev"} | json | jti="<session-uuid>"
#   {compose_project="reconciliation-platform-dev", compose_service="api"} | json | jti="<session-uuid>"

name: recon-observability

networks:
  # References the real Dev deploy's `app` network by its actual Compose-generated name
  # (`${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}_app` in compose.yaml) -- override
  # APP_NETWORK_NAME to point this at a different Dev-slot stack instead.
  recon-app:
    name: ${APP_NETWORK_NAME:-reconciliation-platform-dev_app}
    external: true
  # Same idea, Stage's own network (compose.stage.yaml). Override STAGE_APP_NETWORK_NAME the same
  # way. k6 load-test runs (scripts/pre-flight/k6-load-test.sh) also join this network, so their
  # results can reach this same Prometheus instance via remote-write without a third network hop.
  recon-stage-app:
    name: ${STAGE_APP_NETWORK_NAME:-reconciliation-platform-stage_app}
    external: true

services:
  loki:
    image: grafana/loki:3.3.2
    command: ['-config.file=/etc/loki/loki-config.yaml']
    restart: unless-stopped
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - recon-observability-loki-data:/loki
    ports:
      - '${OBSERVABILITY_LOKI_PORT:-3100}:3100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Replaces Promtail (removed) -- Promtail reached end of life 2026-03-02. This config is a
  # functional equivalent generated via `alloy convert -f promtail` against the old
  # observability/promtail/promtail-config.yaml and hand-verified against the tool's own `fmt`
  # validation, not hand-written from scratch, specifically to minimize the chance of silently
  # losing behavior during the migration. See observability/alloy/config.alloy for the full
  # reasoning on each component.
  alloy:
    image: grafana/alloy:v1.18.1
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--storage.path=/var/lib/alloy/data',
        '/etc/alloy/config.alloy',
      ]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - recon-observability-alloy-data:/var/lib/alloy/data
      # Read-only: Alloy only ever needs to discover containers and stream their logs, never
      # start/stop/inspect-write anything -- same justification as Promtail's identical mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '${OBSERVABILITY_ALLOY_PORT:-12345}:12345'
    healthcheck:
      # grafana/alloy's image has neither wget nor curl (confirmed directly against the running
      # container, same limitation Promtail's image had) -- same bash /dev/tcp workaround as
      # Promtail's own healthcheck used, for the same reason (/bin/sh here is dash, which doesn't
      # support /dev/tcp).
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Per-container CPU/memory/network -- added specifically to answer a question raised while
  # building k6 load testing: Dev and Stage run concurrently on the same laptop and share its CPU,
  # even though they don't port-conflict, so a k6 run's numbers could be skewed by whatever Dev's
  # own containers are doing at the same moment. This makes that contention visible instead of
  # inferred. Runs inside Docker Desktop's own Linux VM on macOS, same as everything else in this
  # stack -- reports on containers as the Docker Engine sees them, which is exactly the right scope
  # here (not a claim about literal Mac hardware, see node-exporter's own comment below for that
  # same distinction applied to host-level metrics).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      # NOT `/var/run:/var/run:ro` (looks equivalent, isn't). On Docker Desktop for macOS, mounting
      # the whole `/var/run` DIRECTORY as a bind-mount source resolves against the macOS host's own
      # /var/run (confirmed live: with that mount, `docker exec`ing in showed launchd sockets like
      # com.apple.* and a docker.sock symlinked to `/Users/<user>/.docker/run/docker.sock`, i.e. the
      # Mac's Docker Desktop CLI socket -- not the Linux VM's own /var/run where dockerd/containerd
      # actually listen). This is specific to Desktop's "default Docker socket" forwarding feature,
      # which intercepts directory-level mounts of that exact path; `/var/lib/docker` and other
      # `/var/*` sources are unaffected (verified separately). `/run` (no `var`) isn't covered by
      # that forwarding and correctly reaches the VM's real socket directory, confirmed by finding
      # dockerd's and containerd's real sockets there via a throwaway container.
      - /run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - '${OBSERVABILITY_CADVISOR_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Host-level CPU/memory/disk/network. On Docker Desktop for macOS (the only platform this stack
  # targets, per this file's own header comment), "host" means Docker Desktop's own Linux VM, not
  # literally the Mac's hardware -- Docker Desktop's VM is a real, resource-constrained environment
  # in its own right (it's what all these containers actually compete for CPU/memory inside), so
  # this is still the correct thing to measure for the same k6-contention question cadvisor above
  # answers at the container level; it just isn't a substitute for a macOS-native hardware monitor.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '${OBSERVABILITY_NODE_EXPORTER_PORT:-9100}:9100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9100/metrics >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Lets k6 (scripts/pre-flight/k6-load-test.sh) push its own run metrics in as time series via
      # --out experimental-prometheus-rw, rather than only ever reading a one-off JSON summary --
      # the whole point of feeding load-test results in here is comparing one run against another
      # over time in the same dashboard the app's own metrics already live in.
      - '--web.enable-remote-write-receiver'
      # Local-only stack (see this file's own header comment -- not exposed beyond localhost, no
      # real credentials behind it, same trust boundary Grafana's anonymous-admin access already
      # relies on below). Enables POST /api/v1/admin/tsdb/delete_series -- the only way to purge a
      # specific stale series (e.g. a scanner/attacker-probed nonexistent route that got recorded
      # as its own permanent "route" label before apiMetrics.ts's /unmatched fix) without wiping
      # this Prometheus instance's entire history, including k6's own run-over-run baseline data.
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - default
      - recon-app
      - recon-stage-app
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - recon-observability-prometheus-data:/prometheus
    ports:
      - '${OBSERVABILITY_PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      # Local debugging tool only -- not exposed beyond localhost, no real credentials behind it.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Editor'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - recon-observability-grafana-data:/var/lib/grafana
    ports:
      - '${OBSERVABILITY_GRAFANA_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  recon-observability-loki-data:
  recon-observability-alloy-data:
  recon-observability-grafana-data:
  recon-observability-prometheus-data:
