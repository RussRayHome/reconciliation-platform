services:
  postgres:
    build:
      args:
        POSTGRES_BASE_IMAGE: postgres:16.14
        ENABLE_PGAUDIT: 'true'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit

  web:
    build:
      args:
        VITE_ENABLE_DEVELOPER_DASHBOARD: 'true'
        VITE_ENVIRONMENT_PATH_SEGMENT: 'stage'

  tools:
    image: reconciliation-platform-tools:latest
    user: '0:0'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
      - tools-node-modules:/app/node_modules
      - tools-dist:/app/apps/api/dist
      - recon-app-state:/var/lib/reconciliation
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'safe.directory'
      GIT_CONFIG_VALUE_0: '/app'
      NODE_ENV: test
      DEPLOY_ENV: stage
      PORT: '4001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      RECON_PERSISTENCE_BACKEND: ${RECON_PERSISTENCE_BACKEND:-postgres}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://recon_app:change-stage-password@postgres:5432/reconciliation_platform}
      ENABLE_DEVELOPER_DIAGNOSTICS: 'true'
      RECONCILIATION_RUN_STORE_PATH: /var/lib/reconciliation/latest-reconciliation-run.json
      PLAYWRIGHT_BASE_URL: http://web:8080
      PLAYWRIGHT_API_URL: http://api:4000
    expose:
      - '4001'
    ports:
      - '${TOOLS_PORT:-4002}:4001'
    networks:
      - default
      - app
      - data
    restart: unless-stopped
    mem_limit: ${TOOLS_MEM_LIMIT:-4g}
    mem_reservation: ${TOOLS_MEM_RESERVATION:-1g}
    cpus: ${TOOLS_CPUS:-2.00}
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4001/api/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgweb:
    image: sosedoff/pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-recon_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-reconciliation_platform}?sslmode=disable
    ports:
      - '${PGWEB_PORT:-8181}:8081'
    depends_on:
      - postgres
    networks:
      - default
      - app
      - data
      - edge
    restart: unless-stopped
    mem_limit: ${PGWEB_MEM_LIMIT:-256m}
    mem_reservation: ${PGWEB_MEM_RESERVATION:-64m}
    cpus: ${PGWEB_CPUS:-0.50}
    stop_grace_period: 30s

  nginx-ui:
    image: uozi/nginx-ui:latest
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - '${NGINX_UI_HTTP_PORT:-8182}:9000'
    volumes:
      - recon-nginx-ui-data:/etc/nginx-ui
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge
    restart: unless-stopped
    mem_limit: ${NGINX_UI_MEM_LIMIT:-512m}
    mem_reservation: ${NGINX_UI_MEM_RESERVATION:-128m}
    cpus: ${NGINX_UI_CPUS:-1.00}
    stop_grace_period: 90s

volumes:
  recon-nginx-ui-data:
  tools-node-modules:
  tools-dist:
