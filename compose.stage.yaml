services:
  postgres:
    build:
      args:
        POSTGRES_BASE_IMAGE: postgres:16.14
        ENABLE_PGAUDIT: 'true'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      # See compose.dev.yaml's comment on this same setting -- ddl+role, not write, deliberately.
      - -c
      - pgaudit.log=ddl, role

  web:
    build:
      args:
        VITE_ENVIRONMENT_PATH_SEGMENT: 'stage'
    # Republishes plain HTTP alongside compose.yaml's default HTTPS publish (ports merge across
    # compose files, they don't replace) so stage keeps a working plain-HTTP entry point too.
    # The HTTPS port is no longer inert: see the volumes/healthcheck overrides below -- same
    # persistent-cert approach as compose.dev.yaml, just from certs/stage instead of certs/dev
    # (and via its own PUBLIC_WEB_HTTPS_PORT so it doesn't collide with dev's when both stacks
    # run at once).
    ports:
      - '${PUBLIC_WEB_PORT:-4173}:8080'
    volumes:
      - ./certs/stage:/etc/nginx/certs:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-recon_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-reconciliation_platform}?sslmode=disable
    ports:
      - '${PGWEB_PORT:-8181}:8081'
    depends_on:
      - postgres
    networks:
      - default
      - app
      - data
      - edge
    restart: unless-stopped
    mem_limit: ${PGWEB_MEM_LIMIT:-256m}
    mem_reservation: ${PGWEB_MEM_RESERVATION:-64m}
    cpus: ${PGWEB_CPUS:-0.50}
    stop_grace_period: 30s

  nginx-ui:
    image: uozi/nginx-ui:2.5.10
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - '${NGINX_UI_HTTP_PORT:-8182}:9000'
    volumes:
      - recon-nginx-ui-data:/etc/nginx-ui
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge
    restart: unless-stopped
    mem_limit: ${NGINX_UI_MEM_LIMIT:-512m}
    mem_reservation: ${NGINX_UI_MEM_RESERVATION:-128m}
    cpus: ${NGINX_UI_CPUS:-1.00}
    stop_grace_period: 90s

volumes:
  recon-nginx-ui-data:
