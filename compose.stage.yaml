services:
  postgres:
    build:
      args:
        POSTGRES_BASE_IMAGE: postgres:16.13
        ENABLE_PGAUDIT: "true"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit

  web:
    build:
      args:
        VITE_ENABLE_DEVELOPER_DASHBOARD: "false"
        VITE_ENVIRONMENT_PATH_SEGMENT: "stage"

  pgweb:
    image: sosedoff/pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-recon_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-reconciliation_platform}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      - postgres
    networks:
      - default
      - app
      - data
    restart: unless-stopped
    mem_limit: ${PGWEB_MEM_LIMIT:-256m}
    mem_reservation: ${PGWEB_MEM_RESERVATION:-64m}
    cpus: ${PGWEB_CPUS:-0.50}
    stop_grace_period: 30s

  nginx-ui:
    image: uozi/nginx-ui:latest
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${NGINX_UI_HTTP_PORT:-8182}:9000"
    volumes:
      - recon-nginx-ui-data:/etc/nginx-ui
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge
    restart: unless-stopped
    mem_limit: ${NGINX_UI_MEM_LIMIT:-512m}
    mem_reservation: ${NGINX_UI_MEM_RESERVATION:-128m}
    cpus: ${NGINX_UI_CPUS:-1.00}
    stop_grace_period: 90s

volumes:
  recon-nginx-ui-data:
