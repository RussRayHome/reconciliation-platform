x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: ${PORT:-4000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  RECON_PERSISTENCE_BACKEND: ${RECON_PERSISTENCE_BACKEND:-postgres}
  DATABASE_URL: ${API_DATABASE_URL:-postgresql://recon_app:change-local-password@postgres:5432/reconciliation_platform}
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
  PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-60000}
  ENABLE_API_METRICS: ${ENABLE_API_METRICS:-true}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
  RATE_LIMIT_USE_REDIS: ${RATE_LIMIT_USE_REDIS:-true}
  RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379}
  RATE_LIMIT_REDIS_PREFIX: ${RATE_LIMIT_REDIS_PREFIX:-recon:rate-limit:}
  ENABLE_DEVELOPER_DIAGNOSTICS: ${ENABLE_DEVELOPER_DIAGNOSTICS:-false}
  RECONCILIATION_RUN_STORE_PATH: ${RECONCILIATION_RUN_STORE_PATH:-/var/lib/reconciliation/latest-reconciliation-run.json}

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-64m}
    cpus: ${REDIS_CPUS:-0.50}
    stop_grace_period: 30s
    volumes:
      - recon-redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  postgres:
    image: ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-data
    build:
      context: ./
      dockerfile: Dockerfile.postgres
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:16.14}
        ENABLE_PGAUDIT: ${ENABLE_PGAUDIT:-false}
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-data:latest
    environment:
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
      POSTGRES_DB: ${POSTGRES_DB:-reconciliation_platform}
      POSTGRES_USER: ${POSTGRES_USER:-recon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-512m}
    cpus: ${POSTGRES_CPUS:-1.50}
    stop_grace_period: 45s
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    expose:
      - "5432"
    volumes:
      - recon-postgres-data:/var/lib/postgresql/data
    networks:
      - default
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recon_app} -d ${POSTGRES_DB:-reconciliation_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-migrate:latest
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-api:latest
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-api-dev:latest
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *api-environment
      RUN_DB_MIGRATIONS_ON_BOOT: "true"
    command: ["node", "apps/api/dist/migrate.cjs"]
    restart: "no"
    mem_limit: ${MIGRATE_MEM_LIMIT:-768m}
    mem_reservation: ${MIGRATE_MEM_RESERVATION:-256m}
    cpus: ${MIGRATE_CPUS:-1.00}
    stop_grace_period: 45s
    networks:
      - data
    logging: *default-logging

  api:
    image: ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-api:latest
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-api-dev:latest
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-migrate:latest
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      RUN_DB_MIGRATIONS_ON_BOOT: ${RUN_DB_MIGRATIONS_ON_BOOT:-false}
    expose:
      - "4000"
    volumes:
      - recon-app-state:/var/lib/reconciliation
    networks:
      - app
      - data
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2g}
    mem_reservation: ${API_MEM_RESERVATION:-768m}
    cpus: ${API_CPUS:-2.00}
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    image: ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - ${COMPOSE_PROJECT_NAME:-reconciliation-platform-dev}-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_WEB_PORT:-4173}:8080"
    networks:
      - edge
      - app
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    mem_reservation: ${WEB_MEM_RESERVATION:-128m}
    cpus: ${WEB_CPUS:-1.00}
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  recon-redis-data:
  recon-postgres-data:
  recon-app-state:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
