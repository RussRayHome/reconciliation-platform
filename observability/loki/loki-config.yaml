# Minimal single-binary Loki config for local Dev/Stage debugging only -- filesystem storage, no
# auth, no retention/compaction tuning. Not meant to run anywhere but a developer's own machine.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Local debugging data, not compliance evidence -- reconciliation_login_event and the other
  # audit tables remain the durable system of record. Two weeks is enough to cover an active
  # vetting/hardening pass without the volume growing unbounded on a dev machine.
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
