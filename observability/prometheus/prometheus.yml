# Scrapes apps/api's existing Prometheus-format /api/metrics endpoint (ENABLE_API_METRICS,
# apps/api/src/services/apiMetrics.ts) -- unauthenticated by design (see PUBLIC_ROUTES in
# authMiddleware.ts, "operational scrape endpoint, not customer data"). Only `api` exposes this;
# `worker` (Issue #134) never starts an HTTP server, so it has no metrics endpoint to scrape --
# its operational visibility stays log-derived (see the Loki panels in the dashboard instead).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus's own config format has no env-var substitution (unlike Docker Compose's `${...}`),
  # so these labels are literal strings, not templated -- matches the two real, standing project
  # names this observability stack is built for (see compose.observability.yaml's own header
  # comment: it joins both the Dev and Stage `_app` networks). Point APP_NETWORK_NAME/
  # STAGE_APP_NETWORK_NAME at different stacks to scrape different environments; update these
  # labels to match if you do. Prometheus itself is one container joined to BOTH the Dev and Stage
  # app networks at once, so the bare compose-service alias `api` is ambiguous the moment both
  # networks are joined simultaneously (each network has its own container using that same alias)
  # -- Docker's embedded DNS can't disambiguate a same-alias lookup across two networks a single
  # container belongs to. Each stack's actual container name is globally unique on the host, so
  # target by that instead of the alias.
  - job_name: recon-api-dev
    metrics_path: /api/metrics
    static_configs:
      - targets: ['reconciliation-platform-dev-api-1:4000']
        labels:
          compose_project: 'reconciliation-platform-dev'

  - job_name: recon-api-stage
    metrics_path: /api/metrics
    static_configs:
      - targets: ['reconciliation-platform-stage-api-1:4000']
        labels:
          compose_project: 'reconciliation-platform-stage'

  # cadvisor/node-exporter (compose.observability.yaml) -- per-container and host-level resource
  # usage, added to make Dev/Stage's shared-laptop CPU contention visible during a k6 run instead
  # of inferred. Both are single instances on this project's own `default` network (unlike the
  # api-dev/api-stage split above), no alias ambiguity to work around.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
